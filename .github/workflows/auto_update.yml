name: Update 539 Data

on:
  schedule:
    # 台灣時間 20:40、21:00、22:00、23:00（對應 UTC 12:40、13:00、14:00、15:00），週一至週六執行
    - cron: '40 12 * * 1-6'
    - cron: '0 13 * * 1-6'
    - cron: '0 14 * * 1-6'
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          TOKEN_88LL88: ${{ secrets.TOKEN_88LL88 }}
          TOKEN_88L88: ${{ secrets.TOKEN_88L88 }}
        run: node update.js
