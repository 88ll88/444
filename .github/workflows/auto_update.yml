name: Update 539 Data

on:
  schedule:
    # 台灣時間 20:40、21:00、22:00、23:00（對應 UTC 12:40、13:00、14:00、15:00），週一至週六執行
    - cron: '40 12 * * 1-6'
    - cron: '0 13 * * 1-6'
    - cron: '0 14 * * 1-6'
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vvv.js
          git diff --staged --quiet || (git commit -m "Update vvv.js" && git push)
