name: Record Live Draw

on:
  schedule:
    # 每天 UTC 12:31 啟動（即台灣時間 20:31，週一到週六開獎日）
    - cron: '31 12 * * 1-6'
  workflow_dispatch: # 保留手動測試按鈕

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update.js
        run: node update.js

      - name: Commit and push sss.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sss.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "紀錄即時開獎落球" && git push)
